# Route transcription through the OpenAI realtime API (streams while you talk),
# with automatic fallback to the local faster-whisper model on any failure.
# Implementation: ~/.local/lib/blurt-live/blurt_live.py — nothing under
# /usr/lib/blurt is modified, so pacman upgrades of blurt cannot clobber it.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 -m blurt_live
Environment=PYTHONPATH=/usr/lib/blurt:%h/.local/lib/blurt-live
